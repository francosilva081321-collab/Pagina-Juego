<nav>
    <a class="logo" href="{% url 'hola' %}">BIO<span>VOID</span></a>
    <ul class="nav-links" id="navLinks">
        <li><a href="{% url 'hola' %}"{% if request.resolver_match.url_name == 'hola' %} class="active"{% endif %}>Inicio</a></li>
        <li><a href="{% url 'historia' %}"{% if request.resolver_match.url_name == 'historia' %} class="active"{% endif %}>Historia</a></li>
        <li><a href="{% url 'personajes' %}"{% if request.resolver_match.url_name == 'personajes' %} class="active"{% endif %}>Personajes</a></li>
        <li><a href="{% url 'descarga' %}"{% if request.resolver_match.url_name == 'descarga' %} class="active"{% endif %}>Descarga</a></li>
        {% if user.is_authenticated %}
            <li><span class="nav-user">{{ user.username }}</span></li>
            <li>
                <form action="{% url 'logout' %}" method="post" class="nav-logout-form" onsubmit="return confirm('¿Estás seguro de que quieres cerrar sesión?');">
                    {% csrf_token %}
                    <button class="nav-logout" type="submit">Salir</button>
                </form>
            </li>
        {% else %}
            <li><a href="{% url 'login' %}"{% if request.resolver_match.url_name == 'login' %} class="active"{% endif %}>Iniciar sesión</a></li>
            <li><a href="{% url 'registro' %}"{% if request.resolver_match.url_name == 'registro' %} class="active"{% endif %}>Crear cuenta</a></li>
        {% endif %}
    </ul>
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú">☰</button>
</nav>
