{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisa tu correo | BioVoid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <div class="auth-background"></div>
    <main class="auth-card">
        <a class="auth-logo" href="{% url 'hola' %}">BIO<span>VOID</span></a>
        <p class="eyebrow">INSTRUCCIONES ENVIADAS</p>
        <h1>Revisa tu correo</h1>
        <p class="auth-description">Si existe una cuenta asociada a ese correo, enviaremos instrucciones para restablecer la contraseña. Revisa también la carpeta de correo no deseado.</p>
        <a class="auth-submit auth-button-link" href="{% url 'login' %}">Volver a iniciar sesión</a>
    </main>
</body>
</html>
